name: artex-deploy-frp

# 用途：在 GitHub Actions runner 上从源码构建 ARTEX（Go 后端 + Next 静态前端），
#      拉起 PostgreSQL，跑起 Web 服务（:8787），再用 frpc 反向代理到公网 frps
#      （203.195.195.52:7023）。runner 是临时的，所以用 keep-alive + 定时 cron 续命。

on:
  workflow_dispatch:
  schedule:
    # 关键：job 寿命约 6h，排班必须比寿命更密，否则两轮之间必留空窗。
    # 之前用 0 */6 出现过「19:27 起跑、01:09 结束、下一班 06:00」的 5 小时断线。
    # 现在每 2 小时拉一轮，cancel-in-progress 顶掉旧轮 → 任何时刻都有活跃隧道。
    - cron: "0 */2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-artex-frp.yml"
      - "deploy/**"

permissions:
  contents: read

concurrency:
  group: artex-frp
  cancel-in-progress: true

env:
  # ---- ARTEX 源码 ----
  ARTEX_REPO: https://github.com/RuoJi6/ARTEX.git
  # ---- frp 服务端（你给的 203.195.195.52:7023 作为 frps 的 bind_port）----
  FRP_SERVER_ADDR: "203.195.195.52"
  FRP_SERVER_PORT: "7023"
  # 公网访问端口：需要在 frps 的 allow_ports 与云安全组里放行
  FRP_REMOTE_PORT: ${{ vars.FRP_REMOTE_PORT || '18087' }}
  # ---- runner 内部 ----
  ARTEX_ADDR: ":8787"
  ARTEX_PROXY: "127.0.0.1:8788"
  # nginx 边缘层端口（frpc 暴露的是它，不是 8787）
  EDGE_PORT: "8080"
  # ---- 跨轮持久化 ----
  # 这个目录整体进 Actions 缓存：数据库转储 + ARTEX 自身数据目录。
  # 下一轮先恢复它，再启动 artex，做到「接着上次跑」。
  STATE_DIR: ${{ github.workspace }}/.artex-state
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  serve:
    name: build + run + frp tunnel
    runs-on: ubuntu-latest
    # 值守拆成两段（各 ~50 分钟），中间存一次快照；整轮约 110 分钟，
    # 必须短于 cron 的 2 小时，否则每轮都会被下一轮取消，缓存后置步骤就不会执行。
    timeout-minutes: 150

    services:
      postgres:
        image: postgres:16-alpine
        # 一次性容器内数据库，密码仅在本 job 生命周期内有效
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex_ci_ephemeral_pw
          POSTGRES_DB: artex
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      ARTEX_PG_DSN: postgres://artex:artex_ci_ephemeral_pw@127.0.0.1:5432/artex?sslmode=disable
      ARTEX_SKILL_DIR: ${{ github.workspace }}/artex/skills
      FRP_TOKEN: ${{ secrets.FRP_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ARTEX_LLM_PROVIDER: ${{ vars.ARTEX_LLM_PROVIDER }}
      ARTEX_LLM_MODEL: ${{ vars.ARTEX_LLM_MODEL }}
      ARTEX_LLM_BASE_URL: ${{ vars.ARTEX_LLM_BASE_URL }}

    steps:
      # ---------- 1. 取源码 ----------
      - name: Checkout ARTEX
        uses: actions/checkout@v4
        with:
          repository: Ruoji6/ARTEX
          path: artex
          fetch-depth: 1

      - name: Show source revision
        run: |
          cd artex
          commit=$(git rev-parse HEAD)
          echo "ARTEX_COMMIT=${commit}" >> "$GITHUB_ENV"
          echo "ARTEX 源码 commit: ${commit}" | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------- 2. 前端静态导出 ----------
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: artex/web/package-lock.json

      - name: Build frontend (static export)
        working-directory: artex/web
        run: |
          npm ci --no-audit --no-fund
          npm run build:static
          test -f out/index.html || { echo "静态导出缺少 out/index.html" >&2; exit 1; }
          du -sh out

      - name: Sync frontend into embed path
        run: |
          mkdir -p artex/server/webui/dist
          cp -a artex/web/out/. artex/server/webui/dist/
          ls artex/server/webui/dist | head

      # 隧道只有 ~15KB/s，先把静态资源预压缩：nginx gzip_static 直接吐 .gz，
      # 省掉每次请求的实时压缩开销，压缩比也固定可预期（实测 JS ≈ 40%）。
      - name: Precompress static assets
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zopfli >/dev/null 2>&1 || sudo apt-get install -y -qq gzip >/dev/null
          cd "$GITHUB_WORKSPACE/artex/server/webui/dist"
          before=$(find . -type f ! -name '*.gz' -printf '%s\n' | awk '{s+=$1} END{print s+0}')
          n=0
          while IFS= read -r -d '' f; do
            gzip -9 -k -f "$f" && n=$((n+1))
          done < <(find . -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \
               -o -name '*.json' -o -name '*.svg' -o -name '*.txt' -o -name '*.xml' \) -print0)
          gz=$(find . -name '*.gz' -printf '%s\n' | awk '{s+=$1} END{print s+0}')
          echo "预压缩 ${n} 个文件"
          echo "原始合计 $((before/1024)) KB → .gz 合计 $((gz/1024)) KB"
          

      # ---------- 3. Go 后端 ----------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: artex/go.mod
          check-latest: true
          cache-dependency-path: artex/go.sum

      - name: Build artex (embedui)
        working-directory: artex
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go version
          go build -tags embedui -trimpath \
            -ldflags "-s -w -X main.version=ci-${GITHUB_SHA::8}" \
            -o /tmp/artex-bin ./cmd/artex
          ls -lh /tmp/artex-bin
          /tmp/artex-bin -h 2>&1 | head -20 || true

      # ---------- 4. frpc ----------
      - name: Install frpc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                 https://api.github.com/repos/fatedier/frp/releases/latest | jq -r .tag_name)
          echo "frp version: ${ver}"
          num="${ver#v}"
          curl -fsSL -o /tmp/frp.tgz \
            "https://github.com/fatedier/frp/releases/download/${ver}/frp_${num}_linux_amd64.tar.gz"
          tar -xzf /tmp/frp.tgz -C /tmp
          install -m 0755 "/tmp/frp_${num}_linux_amd64/frpc" /usr/local/bin/frpc
          frpc -v

      - name: Render frpc.toml
        run: |
          set -euo pipefail
          {
            echo "serverAddr = \"${FRP_SERVER_ADDR}\""
            echo "serverPort = ${FRP_SERVER_PORT}"
            echo "loginFailExit = false"
            echo "log.to = \"/tmp/frpc.log\""
            echo "log.level = \"info\""
            if [ -n "${FRP_TOKEN}" ]; then
              echo "auth.method = \"token\""
              echo "auth.token = \"${FRP_TOKEN}\""
            fi
            echo ""
            echo "# 以下为客户端级 transport 配置，必须写在 [[proxies]] 之前"
            echo "transport.poolCount = 4"
            echo "transport.heartbeatInterval = 15"
            echo "transport.heartbeatTimeout = 45"
            echo ""
            echo "[[proxies]]"
            echo "name = \"artex-web\""
            echo "type = \"tcp\""
            echo "localIP = \"127.0.0.1\""
            echo "localPort = ${EDGE_PORT}"
            echo "remotePort = ${FRP_REMOTE_PORT}"
          } > /tmp/frpc.toml
          echo "----- frpc.toml -----"
          sed -e 's/^\(auth.token = \).*/\1"***"/' /tmp/frpc.toml
          frpc verify -c /tmp/frpc.toml

      # ---------- 5. 跨轮状态恢复 ----------
      # 缓存 key 用 run_id 保证唯一，restore-keys 前缀匹配「最近一次」的快照，
      # 这样就实现了「上一轮的数据拿来这一轮直接用」。
      - name: Restore state cache
        id: state-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.artex-state
          key: artex-state-${{ github.run_id }}
          restore-keys: |
            artex-state-
          enableCrossOsArchive: false

      - name: Inspect restored state
        run: |
          set -eu
          echo "缓存命中: ${{ steps.state-restore.outputs.cache-matched-key || '<无>' }}"
          if [ -d "${STATE_DIR}" ]; then
            du -sh "${STATE_DIR}" 2>/dev/null || true
            ls -lh "${STATE_DIR}" 2>/dev/null || true
          else
            echo "首轮运行：没有可恢复的状态"
          fi

      - name: Restore database from snapshot
        run: |
          set -eu
          DUMP="${STATE_DIR}/db.sql.gz"
          mkdir -p "${STATE_DIR}"
          if [ ! -s "${DUMP}" ]; then
            echo "没有数据库快照，按全新数据库启动"
            exit 0
          fi
          echo "快照大小: $(du -h "${DUMP}" | cut -f1)"
          command -v pg_restore >/dev/null 2>&1 || command -v psql >/dev/null 2>&1 || \
            sudo apt-get install -y -qq postgresql-client >/dev/null
          # 等 postgres service 真正可连接
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U artex -d artex >/dev/null 2>&1 && break
            sleep 2
          done
          if gunzip -c "${DUMP}" | psql "${ARTEX_PG_DSN}" -v ON_ERROR_STOP=1 -q > /tmp/restore.log 2>&1; then
            echo "数据库已从快照恢复"
            psql "${ARTEX_PG_DSN}" -tAc "select count(*) from information_schema.tables where table_schema='public'" \
              | xargs -I{} echo "public schema 表数量: {}"
          else
            echo "恢复失败（继续用空库启动，不影响上线）：" >&2
            tail -30 /tmp/restore.log >&2
          fi

      # ---------- 6. 起服务 ----------
      - name: Start artex
        run: |
          set -euo pipefail
          # -data 指向缓存目录，这样 ARTEX 自己的数据也随缓存跨轮保留
          mkdir -p "${STATE_DIR}/data"
          nohup /tmp/artex-bin \
            -addr "${ARTEX_ADDR}" \
            -proxy "${ARTEX_PROXY}" \
            -data "${STATE_DIR}/data" \
            > /tmp/artex.log 2>&1 &
          echo $! > /tmp/artex.pid

      - name: Wait for health
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null "http://127.0.0.1:8787/api/health" 2>/dev/null \
               || curl -fsS -o /dev/null "http://127.0.0.1:8787/" 2>/dev/null; then
              echo "artex 已就绪（第 ${i} 次探测）"
              break
            fi
            if ! kill -0 "$(cat /tmp/artex.pid)" 2>/dev/null; then
              echo "artex 进程已退出，日志：" >&2
              tail -100 /tmp/artex.log >&2
              exit 1
            fi
            sleep 2
            if [ "$i" -eq 90 ]; then
              echo "健康检查超时，日志：" >&2
              tail -100 /tmp/artex.log >&2
              exit 1
            fi
          done
          curl -sS -m 5 "http://127.0.0.1:8787/api/health" || true

      # ---------- 边缘层：nginx 直接托管静态资源 + gzip_static + 长缓存 ----------
      # 目的：1) 静态文件不经 Go，省一次转发；2) .gz 直接吐，1.29MB → ~515KB；
      #      3) /_next/static 带 hash，给 immutable 一年缓存，二次访问零下载。
      - name: Install nginx
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx >/dev/null
          nginx -v

      - name: Configure nginx edge
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/artex/server/webui/dist"
          test -d "$SRC" || { echo "dist 不存在: $SRC" >&2; exit 1; }
          # 关键：nginx 以 www-data 运行，无法穿越 /home/runner/work（other 无 x 位），
          # 必须把静态文件放到它读得到的地方。
          DIST=/var/www/artex
          sudo rm -rf "$DIST"
          sudo mkdir -p "$DIST"
          sudo cp -a "$SRC/." "$DIST/"
          sudo chown -R www-data:www-data "$DIST"
          sudo find "$DIST" -type d -exec chmod 755 {} +
          sudo find "$DIST" -type f -exec chmod 644 {} +
          test -f "$DIST/index.html" || { echo "复制后缺少 index.html" >&2; exit 1; }
          echo "静态资源已就位: $(find "$DIST" -type f | wc -l) 个文件, $(du -sh "$DIST" | cut -f1)"
          echo "gzip 副本: $(find "$DIST" -name '*.gz' | wc -l) 个"
          sudo tee /etc/nginx/sites-available/artex >/dev/null <<EOF
          map \$http_accept_encoding \$gz_ok {
              default 0;
              "~*gzip" 1;
          }

          server {
              listen ${EDGE_PORT} default_server;
              listen [::]:${EDGE_PORT} default_server;
              server_name _;

              root ${DIST};
              index index.html;

              # 关键：nginx 监听 EDGE_PORT(8080)，但公网经 frp 映射到 FRP_REMOTE_PORT(18087)。
              # 默认行为下，目录补斜杠的重定向会拼成绝对 URL 并带上 8080，
              # 浏览器于是跳到 http://host:8080/...（公网不可达）。
              # 关闭绝对重定向，只发相对路径，端口由客户端自行保持。
              absolute_redirect off;
              server_name_in_redirect off;
              port_in_redirect off;
              # 后端若返回绝对重定向，原样透传，不要改写成 127.0.0.1:8787
              proxy_redirect off;

              # 隧道带宽极小，尽量把压缩与缓存做到极致
              gzip on;
              gzip_static on;
              gzip_comp_level 6;
              gzip_min_length 256;
              gzip_proxied any;
              gzip_types text/plain text/css application/javascript application/json
                         image/svg+xml application/xml text/xml;

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 120s;
              keepalive_requests 1000;

              # 带内容 hash 的构建产物：一年不可变缓存
              location /_next/static/ {
                  add_header Cache-Control "public, max-age=31536000, immutable" always;
                  access_log off;
                  try_files \$uri @backend;
              }
              location /_next/image/ {
                  add_header Cache-Control "public, max-age=86400" always;
                  try_files \$uri =404;
              }
              location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|woff2?|ttf|otf|map)\$ {
                  add_header Cache-Control "public, max-age=2592000" always;
                  access_log off;
                  try_files \$uri =404;
              }

              # API 与其余动态请求转发给 Go
              location /api/ {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host \$http_host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_set_header X-Forwarded-Host \$http_host;
                  proxy_buffering on;
                  proxy_read_timeout 600s;
                  proxy_send_timeout 600s;
                  gzip on;
                  gzip_proxied any;
              }

              # 页面：短缓存；找不到就回退给 Go（Go 内嵌了同一份前端，保证不裸 500）
              location / {
                  add_header Cache-Control "public, max-age=60" always;
                  try_files \$uri \$uri/ \$uri/index.html @backend;
              }

              # 兜底：静态找不到时交给 Go 处理（内嵌前端 + 各页路由）
              location @backend {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host \$http_host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_set_header X-Forwarded-Host \$http_host;
                  proxy_read_timeout 600s;
              }
          }
          EOF
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sf /etc/nginx/sites-available/artex /etc/nginx/sites-enabled/artex
          sudo nginx -t
          sudo systemctl restart nginx
          sudo systemctl is-active nginx

      - name: Verify edge (gzip + cache headers)
        # 注意：这里不能用 pipefail —— grep|head 会触发 SIGPIPE(141) 而误判失败。
        # 校验本身也不该阻断上线，失败只告警。
        continue-on-error: true
        run: |
          set -eu
          sleep 2
          echo "--- 首页响应头 ---"
          curl -sS -o /dev/null -D - -H 'Accept-Encoding: gzip' "http://127.0.0.1:${EDGE_PORT}/" \
            | grep -iE 'HTTP/|content-encoding|content-length|cache-control' || true

          echo "--- 抽查 chunk（预压缩资源应返回 gzip + immutable）---"
          chunk=$(curl -sS "http://127.0.0.1:${EDGE_PORT}/" \
                  | grep -oE '/_next/static/chunks/[^"]+\.js' | head -1 || true)
          echo "chunk=${chunk:-<未找到>}"
          if [ -n "${chunk}" ]; then
            raw=$(curl -sS -o /dev/null -w '%{size_download}' -H 'Accept-Encoding: identity' "http://127.0.0.1:${EDGE_PORT}${chunk}")
            gz=$(curl -sS -o /dev/null -w '%{size_download}' -H 'Accept-Encoding: gzip' "http://127.0.0.1:${EDGE_PORT}${chunk}")
            echo "未压缩=${raw}B  gzip=${gz}B  比值=$(awk "BEGIN{printf \"%.1f%%\", ${gz}/${raw}*100}")"
            curl -sS -o /dev/null -D - -H 'Accept-Encoding: gzip' "http://127.0.0.1:${EDGE_PORT}${chunk}" \
              | grep -iE 'HTTP/|content-encoding|content-length|cache-control' || true
          fi

          echo "--- API 透传 ---"
          curl -sS "http://127.0.0.1:${EDGE_PORT}/api/health"; echo

          echo "--- 重定向不得泄露内部端口 ${EDGE_PORT} ---"
          bad=0
          for p in /login /chat /_next/static /settings; do
            loc=$(curl -sS -o /dev/null -D - -H 'Accept: text/html' "http://127.0.0.1:${EDGE_PORT}${p}" \
                  | grep -i '^location:' | tr -d '\r' || true)
            echo "  ${p} -> ${loc:-<无重定向>}"
            case "$loc" in
              *":${EDGE_PORT}"*) echo "    !! Location 泄露内部端口，公网会跳到不可达地址" >&2; bad=1 ;;
            esac
          done
          if [ "$bad" -eq 0 ]; then
            echo "重定向检查通过（相对路径或正确端口）"
          else
            echo "重定向检查失败" >&2
            exit 1
          fi

      - name: Start frpc
        run: |
          set -euo pipefail
          nohup frpc -c /tmp/frpc.toml > /tmp/frpc.stdout 2>&1 &
          echo $! > /tmp/frpc.pid
          sleep 8
          echo "----- frpc 启动输出 -----"
          cat /tmp/frpc.stdout || true
          if grep -qiE "start proxy success|start error|login to server success" /tmp/frpc.stdout; then
            echo "frpc 已与服务端交互"
          fi

      - name: Publish URL
        run: |
          {
            echo "### ARTEX 已上线"
            echo ""
            echo "- 公网地址：http://${FRP_SERVER_ADDR}:${FRP_REMOTE_PORT}"
            echo "- 本地监听：http://127.0.0.1:8787"
            echo "- frps：${FRP_SERVER_ADDR}:${FRP_SERVER_PORT}"
            echo "- ARTEX commit：${ARTEX_COMMIT}"
            echo "- 触发 commit：${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- 7. 值守：掉线自愈；拆成两段，段间存快照 ----------
      - name: Write keepalive + snapshot helpers
        run: |
          set -euo pipefail
          # 快照要用 pg_dump；runner 镜像通常自带，缺失就装
          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          pg_dump --version
          cat > /tmp/keepalive.sh <<'SCRIPT'
          #!/usr/bin/env bash
          # 用法: keepalive.sh <秒数>
          set +e
          dur="${1:-3000}"
          deadline=$(( $(date +%s) + dur ))
          echo "值守开始 ${dur}s，截止 $(date -d "@${deadline}" '+%F %T %Z' 2>/dev/null || echo "$deadline")"
          n=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            n=$((n+1))
            if ! pgrep -f '/tmp/artex-bin' >/dev/null 2>&1; then
              echo "[$(date +%T)] artex 掉线 → 重启"
              nohup /tmp/artex-bin -addr "${ARTEX_ADDR}" -proxy "${ARTEX_PROXY}" \
                -data "${STATE_DIR}/data" >> /tmp/artex.log 2>&1 &
              sleep 15
            fi
            if ! pgrep -f 'nginx: master' >/dev/null 2>&1; then
              echo "[$(date +%T)] nginx 掉线 → 重启"
              sudo systemctl restart nginx || sudo nginx
              sleep 5
            fi
            if ! pgrep -f 'frpc -c /tmp/frpc.toml' >/dev/null 2>&1; then
              echo "[$(date +%T)] frpc 掉线 → 重启"
              nohup frpc -c /tmp/frpc.toml >> /tmp/frpc.stdout 2>&1 &
              sleep 10
            fi
            if [ $((n % 20)) -eq 0 ]; then
              ok=$(curl -fsS -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:${EDGE_PORT}/" || echo 000)
              echo "[$(date +%T)] 心跳 #${n} edge_http=${ok} frp=$(pgrep -fc 'frpc -c /tmp/frpc.toml') db=$(du -sh "${STATE_DIR}" 2>/dev/null | cut -f1)"
            fi
            sleep 30
          done
          echo "本段值守结束"
          SCRIPT
          chmod +x /tmp/keepalive.sh

          cat > /tmp/snapshot.sh <<'SCRIPT'
          #!/usr/bin/env bash
          # 把数据库与 ARTEX 数据目录落盘到 STATE_DIR，供缓存步骤打包。
          set +e
          mkdir -p "${STATE_DIR}"
          if pg_dump --no-owner --no-privileges "${ARTEX_PG_DSN}" 2>/tmp/pgdump.err | gzip -6 > "${STATE_DIR}/db.sql.gz.part"; then
            mv -f "${STATE_DIR}/db.sql.gz.part" "${STATE_DIR}/db.sql.gz"
            echo "数据库快照: $(du -h "${STATE_DIR}/db.sql.gz" | cut -f1)"
          else
            rm -f "${STATE_DIR}/db.sql.gz.part"
            echo "数据库快照失败（保留上一份）:" >&2
            tail -5 /tmp/pgdump.err >&2
          fi
          if [ -d "${STATE_DIR}/data" ]; then
            tar -czf "${STATE_DIR}/data.tgz.part" -C "${STATE_DIR}" data 2>/dev/null \
              && mv -f "${STATE_DIR}/data.tgz.part" "${STATE_DIR}/data.tgz"
            echo "数据目录快照: $(du -h "${STATE_DIR}/data.tgz" 2>/dev/null | cut -f1)"
          fi
          du -sh "${STATE_DIR}" 2>/dev/null
          SCRIPT
          chmod +x /tmp/snapshot.sh
          echo "辅助脚本就绪"

      - name: Keep alive segment 1 (50 min)
        if: success()
        run: bash /tmp/keepalive.sh 3000

      # 段间快照：即使本轮后面被下一轮取消，这份数据也已经进缓存
      - name: Snapshot state (mid-run)
        if: success()
        run: bash /tmp/snapshot.sh

      - name: Save state cache (mid-run)
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.artex-state
          key: artex-state-${{ github.run_id }}-mid

      - name: Keep alive segment 2 (50 min)
        if: success()
        run: bash /tmp/keepalive.sh 3000

      # 收尾快照：本轮正常结束前再存一次，供下一次 cron 恢复
      - name: Snapshot state (final)
        if: success()
        run: bash /tmp/snapshot.sh

      - name: Save state cache (final)
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.artex-state
          key: artex-state-${{ github.run_id }}-final

      - name: Persistence summary
        if: always()
        run: |
          {
            echo "### 跨轮持久化"
            echo ""
            echo "- 恢复来源：${{ steps.state-restore.outputs.cache-matched-key || '首轮（无缓存）' }}"
            echo "- 本轮保存 key：\`artex-state-${{ github.run_id }}-mid\` / \`artex-state-${{ github.run_id }}-final\`"
            echo "- 状态目录内容："
            echo '```'
            ls -lh "${STATE_DIR}" 2>/dev/null || echo "(空)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dump logs
        if: always()
        run: |
          echo "===== artex.log (tail) ====="; tail -60 /tmp/artex.log 2>/dev/null || true
          echo "===== frpc ====="; tail -40 /tmp/frpc.stdout 2>/dev/null || true
          tail -60 /tmp/frpc.log 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          pkill -f 'frpc -c /tmp/frpc.toml' 2>/dev/null || true
          pkill -f '/tmp/artex-bin' 2>/dev/null || true
          exit 0
